# Ingress for the named tunnel `wambito-personal`. The tunnel id and its credentials file
# (~/.cloudflared/<TUNNEL_ID>.json on the host) come from docker-compose.yml, which mounts the file
# read-only and starts `cloudflared tunnel run <TUNNEL_ID>`.
# No `hostname:` here on purpose. A tunnel only receives the names whose DNS route you pointed at it
# (`cloudflared tunnel route dns`), and Caddy in tunnel mode serves any Host on :80. So one catch-all
# serves whatever hostname you routed, and changing PUBLIC_HOSTNAME needs no edit in this file.
ingress:
  - service: http://web:80

Categories:
  - Finance Manager
License: AGPL-3.0-only
WebSite: https://wambito.com
SourceCode: https://github.com/slinqer/wambito
IssueTracker: https://github.com/slinqer/wambito/issues

AutoName: Wambito

RepoType: git
Repo: https://github.com/slinqer/wambito.git

Builds:
  - versionName: 1.0.0
    versionCode: 100001
    commit: mobile-v1.0.0
    subdir: apps/mobile
    sudo:
      - apt-get update
      - apt-get install -y --no-install-recommends ant autoconf automake cmake g++ gcc libasm-java
        libltdl-dev libtool make python3 texinfo
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.47.7
      - vosk-api@625e44c62607a3b48fec6d72a30118448909e83f
      - jna@5.18.1
      - kaldi@8b7fecf92b329b7253d9d1cd97898c8b13f9aef3
      - openfst@18e94e63870ebcf79ebb42b7035cd3cb626ec090
      - OpenBLAS@0b678b19dc03f2a999d6e038814c4c50b9640a4e
      - clapack@f4e1647de96343fb20eea08a9d4f0e0d04c31c51
    prebuild:
      - rm -rf $$jna$$/dist $$jna$$/lib/test/*.jar $$jna$$/test/com/sun/jna/data
      - rm -f $$jna$$/lib/bsh.jar $$jna$$/lib/checkstyle-8.17-all.jar $$jna$$/lib/clover.jar
        $$jna$$/lib/hamcrest-core-1.3.jar $$jna$$/lib/junit.jar
      - ln -sf /usr/share/ant/lib/ant.jar $$jna$$/lib/ant.jar
      - ln -sf /usr/share/java/asm.jar $$jna$$/lib/asm-8.0.1.jar
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get --enforce-lockfile
      - sdkmanager 'platforms;android-36'
      - sed -i -e 's/-Xmx8G/-Xmx4G/' android/gradle.properties
      - grep -q -e '-Xmx4G' android/gradle.properties
    scandelete:
      - apps/mobile/.pub-cache
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - scripts/build-native-deps.sh --abi armeabi-v7a --ndk $$NDK$$ --work /tmp/wambito-native-deps
        --vosk-src $$vosk-api$$ --jna-src $$jna$$ --kaldi-src $$kaldi$$ --openfst-src $$openfst$$
        --openblas-src $$OpenBLAS$$ --clapack-src $$clapack$$
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform android-arm
        --build-name $$VERSION$$ --build-number $(($$VERCODE$$ / 10)) -P wambito.nativeFromSource=true
    ndk: r28c
    timeout: 10800


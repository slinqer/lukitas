AutoUpdateMode: Version
UpdateCheckMode: Tags ^mobile-v
UpdateCheckData: apps/mobile/pubspec.yaml|version:\s[\d.]+\+(\d+)|.|version:\s([\d.]+)\+
VercodeOperation:
  - '%c * 10 + 1'
  - '%c * 10 + 2'
CurrentVersion: 1.0.0
CurrentVersionCode: 100002
